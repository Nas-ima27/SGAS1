services:
  minio:
    image: minio/minio:latest
    container_name: sgas-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Interface web d'administration
    command: server /data --console-address ":9001"
    volumes:
      - sgas-minio-data:/data
  postgres:
    image: postgres:16-alpine
    container_name: sgas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sgas
    ports:
      - "5432:5432"
    volumes:
      - sgas-postgres-data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: sgas-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  sgas-postgres-data:
  sgas-minio-data: